name: LAI release checks

# Production changes are released only by the isolated Authorization Engine
# workflow, which pins an exact Main commit and requires this successful gate.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lai-release-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check source, archives and release boundaries
        run: |
          python3 scripts/test_source_safety.py
          python3 scripts/source_safety.py
          python3 scripts/test_release_boundary.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run backend tests
        run: pnpm --filter @workspace/api-server run test
      - name: Typecheck all packages
        run: pnpm run typecheck
      - name: Run frontend tests
        run: pnpm --filter @workspace/gh-brain run test
      - name: Install browser for local integration tests
        run: pnpm --filter @workspace/gh-brain exec playwright install --with-deps chromium
      - name: Run browser tests against the local app
        working-directory: artifacts/gh-brain
        run: pnpm exec playwright test
      - name: Build API
        run: pnpm --filter @workspace/api-server run build
      - name: Build frontend
        working-directory: artifacts/gh-brain
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: litigant-ai
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_API_URL: "/api-server/api"
          NODE_ENV: production
          BASE_PATH: "/"
        run: pnpm run build
