name: LAI release checks

# Production changes require a descriptor-only commit transporting the private
# Authorization Engine approval of an exact, successful LAI inspection run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-release:
    concurrency:
      group: lai-release-checks-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check source, archives and release boundaries
        run: |
          python3 scripts/test_source_safety.py
          python3 scripts/source_safety.py
          python3 scripts/test_release_boundary.py
          node --test scripts/test_lai_release.mjs scripts/test_lai_credential_migration.mjs scripts/test_lai_feedback_rules.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Test feedback rules in an isolated demo emulator
        run: pnpm exec firebase emulators:exec --only firestore --project demo-litigant-readiness --config firebase.readiness-tests.json "node scripts/test_feedback_rules.mjs"
      - name: Run backend tests
        run: pnpm --filter @workspace/api-server run test
      - name: Typecheck all packages
        run: pnpm run typecheck
      - name: Run frontend tests
        run: pnpm --filter @workspace/gh-brain run test
      - name: Install browser for local integration tests
        run: pnpm --filter @workspace/gh-brain exec playwright install --with-deps chromium
      - name: Run browser tests against the local app
        working-directory: artifacts/gh-brain
        run: pnpm exec playwright test
      - name: Build API
        run: pnpm --filter @workspace/api-server run build
      - name: Build frontend
        working-directory: artifacts/gh-brain
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: litigant-ai
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_API_URL: "/api-server/api"
          NODE_ENV: production
          BASE_PATH: "/"
        run: pnpm run build

  cloud-preflight:
    # No PR, workflow_dispatch, environment, other repository or non-Main OIDC context.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'FlubaDesigns/litigant-ai'
    needs: check-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: lai-production-release
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - name: Validate exact source, CI and approval
        id: plan
        run: node scripts/lai-release.mjs plan
      - uses: actions/checkout@v4
        if: steps.plan.outputs.action == 'deploy'
        with:
          ref: ${{ steps.plan.outputs.source }}
          path: release-source
          persist-credentials: false
      - name: Install immutable source dependencies
        if: steps.plan.outputs.action == 'deploy'
        working-directory: release-source
        run: pnpm install --frozen-lockfile
      - name: Build frontend and probe isolated API container before authentication
        if: steps.plan.outputs.action == 'deploy'
        run: node scripts/lai-release.mjs prepare
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          project_id: litigant-ai
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verify existing LAI cloud access
        run: node scripts/lai-release.mjs release
      - name: Preserve verified runtime identity metadata for central key access
        if: steps.plan.outputs.action == 'inspect'
        uses: actions/upload-artifact@v4
        with:
          name: lai-runtime-identity
          path: ${{ runner.temp }}/lai-${{ github.run_id }}-${{ github.run_attempt }}-identity.json
          if-no-files-found: error
          retention-days: 7
